# Builds three ready-to-use files on every push to main (or by hand), all
# entirely on GitHub's own runner, with no Expo or other outside build
# service (expo prebuild generates the Android project, Gradle builds it):
#
#   kinbridge-phone      the Bazaar version with test ads, arm64 only (small),
#                        to install on the owner's own phone.
#   kinbridge-bazaar     for the Cafe Bazaar console: the signed release app
#                        bundle (kinbridge-bazaar.aab) and Bazaar's signed
#                        digest of it (kinbridge-bazaar.bin), made with
#                        Bazaar's own bundle-signer (see bazaar-release/README.md).
#   kinbridge-play       for the Google Play console: the signed release app
#                        bundle (kinbridge-play.aab), "Kin Bridge", opens in
#                        the phone's language or English. Signed with the same
#                        key; in Play App Signing, upload this key as the app
#                        signing key so Play's builds match Bazaar's.
#
# Every file is signed with the one Bazaar signing key, so each installs as
# an update over the others' installs: the repository secret
# BAZAAR_SIGNING_KEY holds the private key (the PEM text of .ssh-key), and
# bazaar-release/cert.pem is its certificate. Store builds use real ads;
# the phone build uses test ads. Every build's version code is 100 plus the
# run number, so each one is newer than the last upload.
#
# Every check runs first (npm run check:all), so a broken layout is never
# built.
name: Release builds

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-builds
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run every check
        run: npm run -s check:all

  build:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: phone
            variant: bazaar
            ads_test: '1'
            gradle: assembleRelease -PreactNativeArchitectures=arm64-v8a
          - target: bazaar
            variant: bazaar
            ads_test: ''
            gradle: bundleRelease
          - target: play
            variant: play
            ads_test: ''
            gradle: bundleRelease
    env:
      EXPO_PUBLIC_APP_VARIANT: ${{ matrix.variant }}
      EXPO_PUBLIC_ADS_TEST: ${{ matrix.ads_test }}
    steps:
      - uses: actions/checkout@v5

      # Always newer than the last upload (read by app.config.js).
      - name: Set the version code
        run: echo "ANDROID_VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: The signing key must be set
        env:
          BAZAAR_SIGNING_KEY: ${{ secrets.BAZAAR_SIGNING_KEY }}
        run: |
          if [ -z "$BAZAAR_SIGNING_KEY" ]; then
            echo "::error::The repository secret BAZAAR_SIGNING_KEY isn't set (the PEM text of .ssh-key, the Bazaar signing key). Without it the files can't be signed to match Bazaar."
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      # The dev client is only for development builds: leave it out of every
      # release build (package.json stays as it is).
      - name: Drop the dev client
        run: npm uninstall --no-save expo-dev-client

      # The Android SDK comes preinstalled on GitHub's Ubuntu runners (ANDROID_HOME).
      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build
        working-directory: android
        run: ./gradlew ${{ matrix.gradle }} --no-daemon

      # Every phone permission this build asks for, from Android's final
      # merged manifest (so permissions added by libraries, like the ads
      # one, are included, and blocked ones are left out). Shown on the
      # run's summary page for every commit.
      - name: List the phone permissions
        run: |
          MANIFEST=$(find android/app/build/intermediates -path '*release*' -name AndroidManifest.xml \( -path '*merged_manifest*' -o -path '*packaged_manifests*' \) | head -1)
          {
            echo "### Phone permissions: kinbridge-${{ matrix.target }}"
            if [ -z "$MANIFEST" ]; then
              echo "Couldn't find the merged manifest."
            else
              echo ""
              echo "| Permission | What it's for |"
              echo "|---|---|"
              # One line first: the manifest often puts each attribute on its own line.
              tr '\n\r\t' '   ' < "$MANIFEST" | grep -oE '<uses-permission(-sdk-23)?[^>]*android:name="[^"]+"' \
                | sed -E 's/.*android:name="([^"]+)".*/\1/' | sort -u | while read -r perm; do
                case "$perm" in
                  android.permission.INTERNET) why="Internet (ads)";;
                  android.permission.ACCESS_NETWORK_STATE) why="Check if there's a connection (ads)";;
                  android.permission.ACCESS_WIFI_STATE) why="Check Wi-Fi state (ads)";;
                  com.google.android.gms.permission.AD_ID) why="Advertising ID (ads)";;
                  android.permission.READ_MEDIA_IMAGES) why="Pick photos (Android 13+)";;
                  android.permission.READ_MEDIA_VISUAL_USER_SELECTED) why="Pick only chosen photos (Android 14+)";;
                  android.permission.READ_EXTERNAL_STORAGE) why="Pick photos (Android 12 and older only; image picker, file system)";;
                  android.permission.WRITE_EXTERNAL_STORAGE) why="Save files (Android 12 and older only; image picker, file system)";;
                  android.permission.VIBRATE) why="Vibrate (should not be here: blocked in app.json, nothing vibrates)";;
                  android.permission.WAKE_LOCK) why="Keep the phone awake briefly (Google ads library)";;
                  android.permission.RECEIVE_BOOT_COMPLETED) why="Run something after the phone restarts";;
                  android.permission.FOREGROUND_SERVICE) why="Background work (Android WorkManager, inside the Google ads library)";;
                  android.permission.ACCESS_ADSERVICES_AD_ID) why="Ads: advertising ID through Android Privacy Sandbox (Google ads library)";;
                  android.permission.ACCESS_ADSERVICES_ATTRIBUTION) why="Ads: measuring ad clicks and installs (Privacy Sandbox, Google ads library)";;
                  android.permission.ACCESS_ADSERVICES_TOPICS) why="Ads: interest topics for choosing ads (Privacy Sandbox, Google ads library)";;
                  android.permission.CAMERA) why="Camera (should not be here: Bazaar rejects it)";;
                  android.permission.RECORD_AUDIO) why="Microphone (should not be here: Bazaar rejects it)";;
                  android.permission.SYSTEM_ALERT_WINDOW) why="Draw over other apps (should not be here: Bazaar rejects it)";;
                  *.permission.C2D_MESSAGE|*DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION) why="Internal (only this app can use it)";;
                  *) why="**New: check what needs it**";;
                esac
                echo "| \`$perm\` | $why |"
              done
            fi
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare the Bazaar signing key
        env:
          BAZAAR_SIGNING_KEY: ${{ secrets.BAZAAR_SIGNING_KEY }}
        run: |
          printf '%s\n' "$BAZAAR_SIGNING_KEY" > "$RUNNER_TEMP/key.pem"
          # apksigner takes the key as PKCS#8 DER; same key, re-encoded.
          openssl pkcs8 -topk8 -inform PEM -in "$RUNNER_TEMP/key.pem" -outform DER -out "$RUNNER_TEMP/key.pk8" -nocrypt
          # It must be the key behind bazaar-release/cert.pem, or Bazaar rejects the update.
          diff <(openssl pkey -inform DER -in "$RUNNER_TEMP/key.pk8" -pubout) <(openssl x509 -in bazaar-release/cert.pem -noout -pubkey) > /dev/null \
            || { echo "::error::BAZAAR_SIGNING_KEY doesn't match bazaar-release/cert.pem."; exit 1; }

      - name: Sign the APK
        if: matrix.target == 'phone'
        run: |
          mkdir -p out
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" sign --key "$RUNNER_TEMP/key.pk8" --cert bazaar-release/cert.pem \
            --out "out/kinbridge-${{ matrix.target }}.apk" android/app/build/outputs/apk/release/app-release.apk
          "$BUILD_TOOLS/apksigner" verify --print-certs "out/kinbridge-${{ matrix.target }}.apk" | head -3

      - name: Sign the app bundle
        if: matrix.target != 'phone'
        run: |
          mkdir -p out
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          # Gradle signs the release bundle with its debug key; strip that,
          # so the bundle carries only the one signing key (the Bazaar key).
          zip -q -d "$AAB" 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.DSA' 'META-INF/*.EC' 'META-INF/MANIFEST.MF' || true
          # jarsigner wants a keystore: one made on the spot from the key and
          # bazaar-release/cert.pem, with a throwaway password.
          PASS=$(openssl rand -hex 16)
          openssl pkcs12 -export -inkey "$RUNNER_TEMP/key.pem" -in bazaar-release/cert.pem -name bazaar -out "$RUNNER_TEMP/bazaar.p12" -passout "pass:$PASS"
          jarsigner -keystore "$RUNNER_TEMP/bazaar.p12" -storetype PKCS12 -storepass "$PASS" \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            -signedjar "out/kinbridge-${{ matrix.target }}.aab" "$AAB" bazaar
          jarsigner -verify "out/kinbridge-${{ matrix.target }}.aab" | tail -1

      - name: Make Bazaar's signed .bin
        if: matrix.target == 'bazaar'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p tools
          gh release download --repo cafebazaar/bundle-signer --pattern "*.jar" -D tools
          java -jar tools/*.jar genbin -v \
            --bundle out/kinbridge-bazaar.aab \
            --bin out/ \
            --v2-signing-enabled true \
            --v3-signing-enabled false \
            --key "$RUNNER_TEMP/key.pk8" \
            --cert bazaar-release/cert.pem
          ls -la out

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/key.pk8" "$RUNNER_TEMP/key.pem" "$RUNNER_TEMP/bazaar.p12"

      - uses: actions/upload-artifact@v4
        with:
          name: kinbridge-${{ matrix.target }}
          path: out/
          retention-days: 30
