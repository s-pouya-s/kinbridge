# Builds the preview APK entirely on GitHub's own runner, with no Expo or
# other outside build service: expo prebuild generates the Android project
# locally, Gradle builds the release APK, and the APK is uploaded as a
# downloadable artifact. Runs every check first (npm run check:all), so a
# broken layout is never built.
#
# Signing: with the repository secrets ANDROID_KEYSTORE_BASE64 (the keystore
# file, base64), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and
# ANDROID_KEY_PASSWORD set, the APK is signed with that key, so it installs
# over earlier builds signed with it. Without them it keeps the standard
# debug signature Gradle gives a release build: it installs fine, but only
# on a phone without a differently signed copy of the app.
name: Preview APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: preview-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # The same as eas.json's preview profile: test ads only (see AGENTS.md, Ads).
      EXPO_PUBLIC_ADS_TEST: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      - name: Run every check
        run: npm run -s check:all

      # The Android SDK comes preinstalled on GitHub's Ubuntu runners (ANDROID_HOME).
      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build the release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign with the release key, when the repository has one
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            "$BUILD_TOOLS/apksigner" sign \
              --ks "$RUNNER_TEMP/release.keystore" --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
              --ks-key-alias "$ANDROID_KEY_ALIAS" --key-pass env:ANDROID_KEY_PASSWORD \
              --out kinbridge-preview.apk "$APK"
            rm "$RUNNER_TEMP/release.keystore"
          else
            echo "::warning::No release key in the repository secrets, so this APK keeps the debug signature."
            cp "$APK" kinbridge-preview.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: kinbridge-preview-apk
          path: kinbridge-preview.apk
          retention-days: 30
